<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buku Tamu Eksklusif</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        input:focus, textarea:focus { border-color: #764ba2; outline: none; }
        button { 
            width: 100%; padding: 12px; background: #764ba2; 
            color: white; border: none; border-radius: 8px;
            font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #5a387d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buku Tamu</h2>
        <form action="simpan.php" method="POST">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="nama" placeholder="Masukkan nama Anda" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="contoh@email.com" required>
            </div>
            <div class="form-group">
                <label>Asal Instansi</label>
                <input type="text" name="instansi" placeholder="Nama perusahaan/sekolah">
            </div>
            <div class="form-group">
                <label>Pesan/Tujuan</label>
                <textarea name="pesan" rows="4" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>
            <button type="submit">Simpan Data</button>
        </form>
    </div>
</body>
</html>
